[project]
name = "omashelcap"
version = "0.1.0"
description = "Deriv synthetic indices trading bot — full stack"
requires-python = ">=3.12"
dependencies = [
    "websockets>=12.0",
    "pandas>=2.2.2",
    "pandas-ta>=0.3.14b0",
    "numpy>=1.26.4",
    "python-dotenv>=1.0.1",
    "aiohttp>=3.9.5",
    "aiosqlite>=0.20.0",
    "python-telegram-bot>=21.3",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13.1",
    "asyncpg>=0.29.0",
    "pydantic-settings>=2.2.1",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4.4",
    "mypy>=1.10.0",
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.7",
    "httpx>=0.27.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
]
